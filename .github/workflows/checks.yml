name: Check Codex UI Kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python structural and install checks
        run: |
          python3 scripts/check_repo.py
          python3 scripts/check_visual_profile.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check examples/claude-inspired/app.js
          node --check examples/pattern-gallery/app.js
          node --check .agents/skills/conversation-native-ui/assets/patterns.js
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Browser DOM and responsive checks
        run: |
          python3 scripts/build_site.py
          npm run test:browser
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-debug-screenshots
          path: |
            pattern-gallery-ci.png
            pattern-gallery-mobile-ci.png
            site-home-mobile-ci.png
          if-no-files-found: ignore
