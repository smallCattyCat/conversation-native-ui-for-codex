<!doctype html><html lang="en"><meta charset="utf-8"><title>R2 browser checks</title><style>body{font:16px system-ui;padding:24px}pre{white-space:pre-wrap}iframe{height:900px;border:0;position:absolute;top:4000px;left:0}</style><h1>R2 browser checks</h1><pre id="report">Running…</pre><iframe id="target" title="App under test"></iframe><script>
(async()=>{
 const frame=document.getElementById('target'), report=document.getElementById('report');let count=0;const rows=[];
 const check=(value,label)=>{if(!value)throw Error(label);count++;rows.push('PASS '+label)};
 const delay=()=>new Promise(r=>setTimeout(r,60));
 const load=url=>new Promise((r,j)=>{frame.onload=r;frame.onerror=j;frame.src=url});
 try {
 await load('../examples/claude-inspired/index.html');let d=frame.contentDocument,w=frame.contentWindow;
 for(const width of [1425,1024,768,390,320]){frame.style.width=width+'px';await delay();check(w.innerWidth===width,'viewport '+width);check(d.documentElement.scrollWidth<=w.innerWidth,'no horizontal overflow at '+width);const r=d.getElementById('message').getBoundingClientRect();check(r.width>100&&r.right<=width,'composer fits '+width)}
 frame.style.width='1425px';await delay();
 for(const [scenario,title] of [['writing','A clearer argument'],['comparison','Choose the smallest useful surface'],['research','A more focused research question']]){d.querySelector('[data-scenario="'+scenario+'"]').click();check(d.getElementById('result-title').textContent===title,'scenario '+scenario)}
 for(const [mode,color] of [['dark','rgb(20, 20, 19)'],['light','rgb(250, 249, 245)']]){d.querySelector('[data-mode="'+mode+'"]').click();check(w.getComputedStyle(d.body).backgroundColor===color,'theme '+mode)}
 d.querySelector('[data-mode="system"]').click();check(d.querySelector('[data-mode="system"]').getAttribute('aria-pressed')==='true','system option selected');d.querySelector('[data-mode="light"]').click();
 d.getElementById('open-note').click();check(!d.getElementById('working-note').hidden,'note opens');check(d.activeElement.id==='note-content','note receives focus');
 d.getElementById('note-content').value='';d.getElementById('note-content').dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('save-note').click();check(d.getElementById('version-label').textContent==='Version 1','empty note rejected');
 d.getElementById('note-content').value='Revised sample note';d.getElementById('note-content').dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('save-note').click();check(d.getElementById('version-label').textContent==='Version 2','version increments');check(d.getElementById('result-summary').textContent==='Revised sample note','edited content reflected');check(d.getElementById('save-note').disabled,'save disabled after applied edit');d.getElementById('save-note').click();check(d.getElementById('version-label').textContent==='Version 2','unchanged note never increments version');
 d.getElementById('note-content').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(d.getElementById('working-note').hidden,'Escape closes note');check(d.activeElement.id==='open-note','focus restored');
 d.getElementById('open-note').click();d.getElementById('note-content').value='UNSAVED R2 regression';d.getElementById('note-content').dispatchEvent(new w.Event('input',{bubbles:true}));check(d.getElementById('edit-status').textContent.includes('Unsaved changes'),'dirty state visible');d.getElementById('open-note').click();check(d.getElementById('note-content').value==='UNSAVED R2 regression','reopening an open note does not overwrite draft');d.getElementById('close-note').click();d.getElementById('open-note').click();check(d.getElementById('note-content').value==='UNSAVED R2 regression','closed note retains unsaved text');
 d.querySelector('[data-scenario="research"]').click();check(d.getElementById('draft-dialog').open,'switch scenario prompts before discarding');d.getElementById('keep-draft').click();check(!d.getElementById('draft-dialog').open&&d.getElementById('note-content').value==='UNSAVED R2 regression','keep editing preserves draft');d.querySelector('[data-scenario="research"]').click();d.getElementById('discard-draft').click();check(d.getElementById('result-title').textContent==='A more focused research question','confirmed discard switches scenario');check(d.getElementById('note-content').value!=='UNSAVED R2 regression','confirmed discard resets draft');
 check(d.getElementById('send-message').disabled,'empty composer disabled');d.getElementById('message').value='<b>Local input</b>';d.getElementById('message').dispatchEvent(new w.Event('input',{bubbles:true}));check(!d.getElementById('send-message').disabled,'typed input enables submit');d.getElementById('composer').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));const history=d.getElementById('thread-history');check(history.children.length===2,'local messages append without replacing authored example');check(history.children[0].textContent==='<b>Local input</b>'&&!history.children[0].querySelector('b'),'local input rendered as safe text');check(history.children[1].textContent.includes('No AI model analyzed'),'local input truthfully labelled');d.getElementById('message').value='second turn';d.getElementById('message').dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('composer').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));check(history.children.length===4,'second turn retained');check(d.getElementById('conversation').classList.contains('has-activity'),'conversation transitions to active layout');
 d.getElementById('new-chat').click();check(d.getElementById('version-label').textContent==='Version 1','reset clears sample edit');
 frame.style.width='390px';await delay();d.getElementById('open-note').click();await delay();check(d.documentElement.scrollWidth<=w.innerWidth,'mobile note no horizontal overflow');check(w.getComputedStyle(d.getElementById('workspace')).gridTemplateColumns.split(' ').length===1,'mobile note stacks');
 await load('../examples/evidence-workbench/index.html');d=frame.contentDocument;w=frame.contentWindow;
 check(d.getElementById('confirm').disabled,'workbench confirmation initially disabled');d.getElementById('ack').checked=true;d.getElementById('ack').dispatchEvent(new w.Event('change',{bubbles:true}));check(!d.getElementById('confirm').disabled,'review enables local confirmation');d.getElementById('confirm').click();check(d.getElementById('state').textContent.includes('not executed'),'confirmation distinct from execution');d.getElementById('reset').click();check(d.getElementById('confirm').disabled,'workbench resets');
 await load('../examples/pattern-gallery/index.html');d=frame.contentDocument;w=frame.contentWindow;await delay();
 check(!!d.getElementById('inline-card'),'inline card exists');check(d.getElementById('inline-card').querySelectorAll('.cn-actions button').length===2,'inline card uses two bottom actions');
 d.querySelector('[data-card-view="loading"]').click();check(!d.getElementById('card-loading').hidden&&d.getElementById('card-inspect').disabled,'loading skeleton disables actions');d.querySelector('[data-card-view="empty"]').click();check(!d.getElementById('card-empty').hidden,'empty state visible');d.querySelector('[data-card-view="error"]').click();check(!d.getElementById('card-error').hidden,'error state visible');d.querySelector('[data-card-view="ready"]').click();check(!d.getElementById('card-inspect').disabled,'ready state restores actions');
 const collection=d.getElementById('patterns-carousel');check(collection.querySelectorAll('[data-carousel-option]').length===4,'carousel has comparable options');collection.querySelector('[data-carousel-option="Document"] [data-select-option]').click();check(d.getElementById('selection-status').textContent.includes('Document'),'carousel selection announced');check(collection.querySelector('[data-carousel-option="Document"]').getAttribute('aria-current')==='true','selection marked for accessibility');
 d.querySelector('[data-gallery-theme="dark"]').click();check(w.getComputedStyle(d.body).backgroundColor==='rgb(20, 20, 19)','gallery dark theme');d.querySelector('[data-gallery-theme="light"]').click();
 d.getElementById('card-inspect').click();check(d.getElementById('workspace-dialog').open,'inline card opens full screen workspace');const input=d.getElementById('workspace-text');input.value='Changed workspace draft';input.dispatchEvent(new w.Event('input',{bubbles:true}));check(!d.getElementById('workspace-save').disabled,'workspace dirty state enables save');d.getElementById('workspace-close').click();d.querySelector('[data-open-workspace]').click();check(d.getElementById('workspace-text').value==='Changed workspace draft','workspace draft survives close and reopen');d.getElementById('workspace-save').click();check(d.getElementById('workspace-status').textContent.includes('Version 2'),'workspace version increments for actual edit');check(d.getElementById('workspace-save').disabled,'workspace does not save unchanged text');d.getElementById('workspace-close').click();check(!d.getElementById('workspace-dialog').open,'workspace closes without losing context');
 for(const width of [320,390,768,1425]){frame.style.width=width+'px';await delay();check(d.documentElement.scrollWidth<=w.innerWidth,'gallery no horizontal page overflow '+width);check(w.getComputedStyle(collection.querySelector('[data-carousel-track]')).overflowX==='auto','carousel scrolls within track '+width)}
 report.textContent='PASS: '+count+' assertions. Browser DOM interaction and responsive checks. Not a screen-reader or physical-device certification.\n\n'+rows.join('\n');
 }catch(e){report.textContent='FAIL after '+count+' passes: '+e.message+'\n'+rows.join('\n')}
})();</script></html>
